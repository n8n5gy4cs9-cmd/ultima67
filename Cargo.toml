[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Crowelian 2026 + Sonnet"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
directories = "5"

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
